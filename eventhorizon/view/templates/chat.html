<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>太一仙途</title>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  html, body { overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-prose);
    font-size: 15px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    background: var(--sidebar-bg);
    box-shadow: var(--shadow-sm);
  }
  header .title { flex: 1; }
  #header-agent {
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0;
    font-size: 13px;
  }
  #logout-btn { margin: 0; padding: 5px 12px; font-size: 13px; }
  #layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--border);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    line-height: 1.7;
  }
  .bubble { margin-bottom: 16px; white-space: pre-wrap; max-width: 78%; }
  .bubble.narrative {
    background: var(--panel-bg); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow-sm);
  }
  .bubble.system {
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-style: italic;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    display: inline-block;
    border: 1px dashed var(--border);
  }
  .bubble.user {
    color: var(--accent-ink);
    background: var(--accent);
    margin-left: auto;
    padding: 9px 14px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }
  .diff-line { color: var(--text-faint); font-size: 13px; margin: 2px 0 0 4px; }
  #input-bar {
    display: flex;
    border-top: 1px solid var(--border);
    padding: 12px;
    gap: 10px;
    background: var(--sidebar-bg);
  }
  #input-bar input {
    flex: 1;
    border-radius: var(--radius);
    font-size: 15px;
  }
  #input-bar button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 0 20px;
    border-radius: var(--radius);
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  #input-bar button:hover { background: var(--accent-strong); box-shadow: var(--shadow-md); }
  #input-bar button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  #sidebar {
    width: 270px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--sidebar-bg);
    overflow-y: auto;
    min-height: 0;
  }
  .panel {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
  }
  .panel .row { display: flex; justify-content: space-between; margin: 5px 0; }
  .panel .label { color: var(--text-dim); }
  .tidal { color: var(--accent); margin-top: 4px; }
  @media (max-width: 640px) {
    #layout { flex-direction: column; }
    #sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .panel { flex: 1 1 45%; }
  }
</style>
</head>
<body>
  <header>
    <span class="title">太一仙途</span>
    <span id="header-agent" hidden></span>
    <button type="button" id="logout-btn" class="btn secondary" hidden>退出</button>
  </header>
  <div id="layout">
    <div id="main">
      <div id="log"></div>
      <div id="input-bar">
        <input id="text-input" type="text" placeholder="请选择 1 或 2" autocomplete="off" />
        <button id="send-btn">发送</button>
      </div>
    </div>
    <div id="sidebar">
      <div class="panel" id="panel-calendar"></div>
      <div class="panel" id="panel-location"></div>
      <div class="panel" id="panel-character"></div>
    </div>
  </div>

<script>
const STORAGE_AGENT = "eh_agent_id";
const STORAGE_CODE = "eh_verify_code";
const MENU = "请选择：\n1) 建立人物\n2) 进入游戏";
const ASK_ACCOUNT = "请输入人物账号。";
const ASK_CODE = "请输入验证码。";

const log = document.getElementById("log");
const input = document.getElementById("text-input");
const sendBtn = document.getElementById("send-btn");
const headerAgent = document.getElementById("header-agent");
const logoutBtn = document.getElementById("logout-btn");

let agentId = "";
let verifyCode = "";
let pendingAccount = "";
let authPhase = "menu";

function appendBubble(text, cls) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function appendDiffLines(lines) {
  for (const line of lines || []) {
    const div = document.createElement("div");
    div.className = "diff-line";
    div.textContent = "· " + line;
    log.appendChild(div);
  }
  log.scrollTop = log.scrollHeight;
}

function updateSidebar(sidebar) {
  if (!sidebar) return;
  const cal = sidebar.calendar;
  document.getElementById("panel-calendar").innerHTML =
    `<div>${cal.text}</div>` + (cal.is_tidal_day ? `<div class="tidal">☾ 灵气潮汐</div>` : "");

  const loc = sidebar.location;
  document.getElementById("panel-location").innerHTML =
    `<div class="row"><span>${loc.name}</span><span class="label">${loc.location_type}</span></div>` +
    `<div class="row"><span class="label">灵气</span><span>${loc.qi_density_icons}</span></div>` +
    `<div class="row"><span class="label">天气</span><span>${loc.weather}</span></div>`;

  const ch = sidebar.character;
  document.getElementById("panel-character").innerHTML =
    `<div class="row"><span>${ch.cultivation_progress_text}</span></div>` +
    `<div class="row"><span class="label">寿元</span><span>${ch.lifespan_label}</span></div>` +
    `<div class="row"><span class="label">饱食</span><span>${ch.satiety_icons}</span></div>` +
    `<div class="row"><span class="label">金钱</span><span>${ch.money}</span></div>` +
    `<div class="row"><span class="label">背包</span><span>${ch.inventory_count}</span></div>`;
}

function setPlayUi(playing) {
  headerAgent.hidden = !playing;
  logoutBtn.hidden = !playing;
  headerAgent.textContent = playing ? agentId : "";
  if (playing) {
    input.type = "text";
    input.placeholder = "输入你想做什么…";
    input.autocomplete = "off";
  }
}

function setAuthInput(phase) {
  authPhase = phase;
  input.type = "text";
  input.autocomplete = "off";
  if (phase === "menu") {
    input.placeholder = "请选择 1 或 2";
  } else if (phase === "enter_password") {
    input.type = "password";
    input.placeholder = "验证码";
    input.autocomplete = "current-password";
  } else {
    input.placeholder = "人物账号";
    input.autocomplete = "username";
  }
}

function promptMenu(extra) {
  pendingAccount = "";
  verifyCode = "";
  agentId = "";
  setPlayUi(false);
  setAuthInput("menu");
  appendBubble(extra ? extra + "\n\n" + MENU : MENU, "system");
  input.focus();
}

async function readError(res) {
  const data = await res.json().catch(() => ({}));
  if (typeof data.detail === "string") return data.detail;
  return "请求失败。";
}

function persistCredentials(id, code) {
  agentId = id;
  verifyCode = code;
  sessionStorage.setItem(STORAGE_AGENT, id);
  sessionStorage.setItem(STORAGE_CODE, code);
}

function clearCredentials() {
  agentId = "";
  verifyCode = "";
  pendingAccount = "";
  sessionStorage.removeItem(STORAGE_AGENT);
  sessionStorage.removeItem(STORAGE_CODE);
  setPlayUi(false);
  log.replaceChildren();
  promptMenu();
}

function enterGame(data) {
  authPhase = "play";
  setPlayUi(true);
  log.replaceChildren();
  if (data.narrative) appendBubble(data.narrative, "narrative");
  updateSidebar(data.sidebar);
  input.focus();
}

async function loadSession(id, code) {
  const res = await fetch("/api/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ agent_id: id, verify_code: code }),
  });
  if (!res.ok) {
    throw new Error(await readError(res));
  }
  persistCredentials(id, code);
  enterGame(await res.json());
}

async function createCharacter(id) {
  const res = await fetch("/api/character", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ agent_id: id }),
  });
  if (!res.ok) {
    throw new Error(await readError(res));
  }
  return res.json();
}

async function handleAuthInput(text) {
  if (authPhase === "menu") {
    if (text === "1" || text === "建立人物") {
      setAuthInput("create_id");
      appendBubble(ASK_ACCOUNT, "system");
      return;
    }
    if (text === "2" || text === "进入游戏") {
      setAuthInput("enter_id");
      appendBubble(ASK_ACCOUNT, "system");
      return;
    }
    appendBubble("请选择 1 或 2。", "system");
    return;
  }

  if (authPhase === "create_id") {
    const data = await createCharacter(text);
    appendBubble(`人物已建立。验证码是 ${data.verify_code}（只显示一次，请抄下）。`, "system");
    await loadSession(data.agent_id, data.verify_code);
    return;
  }

  if (authPhase === "enter_id") {
    pendingAccount = text;
    setAuthInput("enter_password");
    appendBubble(ASK_CODE, "system");
    return;
  }

  if (authPhase === "enter_password") {
    try {
      await loadSession(pendingAccount, text);
    } catch (err) {
      appendBubble(err.message, "system");
      promptMenu();
    }
  }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  if (authPhase === "enter_password") {
    appendBubble("••••••", "user");
  } else {
    appendBubble(text, "user");
  }
  if (authPhase !== "play") {
    sendBtn.disabled = true;
    try {
      await handleAuthInput(text);
    } catch (err) {
      appendBubble(err.message, "system");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
    return;
  }
  sendBtn.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent_id: agentId, verify_code: verifyCode, text }),
    });
    if (res.status === 401) {
      appendBubble(await readError(res), "system");
      clearCredentials();
      return;
    }
    const data = await res.json();
    const isSystem = Boolean(data.parse_error || data.reject_reason);
    appendBubble(data.narrative, isSystem ? "system" : "narrative");
    appendDiffLines(data.state_diff_lines);
    updateSidebar(data.sidebar);
  } catch (err) {
    appendBubble("（网络错误，请重试）", "system");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

logoutBtn.addEventListener("click", clearCredentials);
sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

(async function boot() {
  const savedId = sessionStorage.getItem(STORAGE_AGENT);
  const savedCode = sessionStorage.getItem(STORAGE_CODE);
  if (savedId && savedCode) {
    try {
      await loadSession(savedId, savedCode);
      return;
    } catch (err) {
      sessionStorage.removeItem(STORAGE_AGENT);
      sessionStorage.removeItem(STORAGE_CODE);
      promptMenu(err.message);
      return;
    }
  }
  promptMenu();
})();
</script>
</body>
</html>
